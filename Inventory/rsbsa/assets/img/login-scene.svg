<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid slice">
<style>
.g{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.rays{transform-origin:720px 250px;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.glow{transform-origin:720px 250px;animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.12);opacity:.5}}
.core{transform-origin:720px 250px;animation:core 6s ease-in-out infinite}
@keyframes core{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.cl{animation:drift linear infinite}
.c1{animation-duration:140s;animation-delay:-40s}.c2{animation-duration:190s;animation-delay:-120s}.c3{animation-duration:165s;animation-delay:-15s}
@keyframes drift{from{transform:translateX(-340px)}to{transform:translateX(1340px)}}
.mist{animation:mist ease-in-out infinite alternate}
.m1{animation-duration:26s}.m2{animation-duration:34s;animation-delay:-12s}.m3{animation-duration:30s;animation-delay:-5s}
@keyframes mist{from{transform:translateX(-70px);opacity:.35}to{transform:translateX(70px);opacity:.7}}

</style>
